<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donda: Spirits Over The Horizon</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">Donda: Spirits Over The Horizon</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "Donda: Spirits Over The Horizon",
  cover: "dondaspiritsoverthehorizoncover.jpg",
  songs: [
      { file: "letthespiritgowild.mp3", title: "Let The Spirit Go Wild", artist: "Kanye West, Nikki Grier, SSC, Ant Clemons" },
      { file: "runitup.mp3", title: "Run It Up", artist: "Kanye West, Dem Jointz" },
      { file: "9.10.mp3", title: "9.10", artist: "Kanye West" },
      { file: "bart.mp3", title: "Bart", artist: "Kanye West" },
      { file: "prayandleaveitthere.mp3", title: "Pray And Leave It There", artist: "Kanye West, Nikki Grier" },
      { file: "hybrid.mp3", title: "Hybrid", artist: "Kanye West, Dem Jointz" },
      { file: "petals.mp3", title: "Petals", artist: "Kanye West" },
      { file: "top.mp3", title: "Tops", artist: "Kanye West, Dem Jointz" },
      { file: "thunder.mp3", title: "Thunder", artist: "Kanye West, Dem Jointz" },
      { file: "allthesefriendsofmine.mp3", title: "All These Friends of Mine", artist: "Kanye West, Digital Nas" },
      { file: "ayeyeyeye.mp3", title: "Aye Ye Ye Ye", artist: "Kanye West, Tee Grizzley" },
      { file: "goleft.mp3", title: "Go Left", artist: "Kanye West, Consequence, Dem Jointz" },
      { file: "hype.mp3", title: "Hype", artist: "Kanye West, Dem Jointz" },
      { file: "nasdaq.mp3", title: "NASDAQ", artist: "Kanye West, Dem Jointz, Stalone" },
      { file: "thunder.mp3", title: "Thunder", artist: "Kanye West, Dem Jointz" },
      { file: "differentcodes.mp3", title: "Different Codes", artist: "Kanye West" },
      { file: "eternal.mp3", title: "Eternal", artist: "Kanye West" },
      { file: "hardrock.mp3", title: "Hard Rock", artist: "Kanye West" },
      { file: "insane.mp3", title: "Insane", artist: "Kanye West" },
      { file: "souldela.mp3", title: "Soul De La", artist: "Kanye West, Dem Jointz, GLC" },
      { file: "hiiiiwyd.mp3", title: "HIIII WYD", artist: "Kanye West, Dem Jointz, Stalone" },
      { file: "dontgoaway.mp3", title: "Don't Go Away", artist: "Kanye West, Dem Jointz" },
      { file: "godspeed.mp3", title: "Godspeed", artist: "Kanye West, Tee Grizzley" },
      { file: "hefejefe.mp3", title: "Hefe Jefe", artist: "Kanye West, Vory" },
      { file: "iletgo.mp3", title: "I Let Go", artist: "Kanye West, Ty Dolla $ign, Cailin Russo" },
      { file: "findout.mp3", title: "Find Out", artist: "Kanye West, Dem Jointz, Jason White" },
      { file: "throughtheroof.mp3", title: "Through The Roof", artist: "Kanye West, BOOTS" },
      { file: "christismyfriend.mp3", title: "Christ Is My Friend", artist: "Kanye West, Nikki Grier, Steve Lacy, SSC" },
      { file: "cometolifev1.mp3", title: "Come To Life", artist: "Kanye West" },
      { file: "iwishyouthebest.mp3", title: "I Wish You The Best", artist: "Kanye West" }
  ]
};

// BACK BUTTON (PUT MAIN REPO LINK HERE)
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/"; // <-- paste main library repo URL here
}

// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;

buildSongs();

// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {
    const div = document.createElement("div");
    div.className = "song";

    div.innerHTML = `
      <strong>${song.title}</strong><br>
      <small>${song.artist || ""}</small>
    `;

    div.onclick = () => playSong(i);

    songsDiv.appendChild(div);
  });
}

// PLAY SONG
function playSong(i) {
  currentIndex = i;

  const song = currentAlbum.songs[i];

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song, currentAlbum);
}

function updateMediaSession(song) {
  if (!('mediaSession' in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      { src: currentAlbum.cover, sizes: "512x512", type: "image/jpg" }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex - 1 + currentAlbum.songs.length) % currentAlbum.songs.length;
    playSong(currentIndex);
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex + 1) % currentAlbum.songs.length;
    playSong(currentIndex);
  });
}

  if ("mediaSession" in navigator) {

  navigator.mediaSession.setActionHandler("play", async () => {
    await audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

}

function togglePlay() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

  audio.addEventListener("play", () => {
  document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
});

audio.addEventListener("pause", () => {
  document.getElementById("playPauseBtn").innerText = "▶️ Play";
});

window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  audio.addEventListener("ended", () => {
    if (!currentAlbum) return;

    const nextIndex = currentIndex + 1;

    if (nextIndex < currentAlbum.songs.length) {
      playSong(nextIndex);
    } else {
      playSong(0);
    }
  });

  // expose audio globally so playSong can use it safely
  window.audio = audio;
});
  
</script>

</body>
</html>
